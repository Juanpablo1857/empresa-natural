<style>

</style></head><body><div class="w">
<h1>🌿 AL NATURAL · Hecho en Casa</h1><div class="mu">Producción, inventario, ventas e insumos en un solo sistema</div>
<div class="r" style="margin-top:10px"><button class="p" onclick="exportX()">💾 Guardar todo en Excel</button><span id="sv" class="mu"></span></div>
<nav id="nav"></nav><div id="v"></div></div>
<script>
const TABS=[["panel","Panel"],["gra","Gráficos"],["rev","Revisión"],["prods","Productos"],["ven","Ventas"],["pro","Producción"],["sup","Insumos"],["imp","Importar Excel"],["con","Conexiones"]];
const MES=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
const K="aln_v2";let tab="panel",cart=[],q="",ed=null,RV=[],gper="m";
let S={prods:[],prod:[],sales:[],sup:[],cfg:{phone:"",hook:""}};
try{const x=localStorage.getItem(K);if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
let noDirty=false;const save=()=>{if(!noDirty&&S.cfg)S.cfg.dirty=1;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"");
const key=(n,s)=>norm(n)+"|"+norm(s);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>(n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString("es-CO");
const nm=p=>p.n+" "+p.sz;
const P=k=>S.prods.find(p=>p.k===k);
const dd=(a,b)=>Math.floor((new Date(b)-new Date(a))/864e5);
const refDate=()=>S.sales.reduce((m,s)=>s.date>m?s.date:m,"2000-01-01")||today();
function alerts(){const a=[],ref=refDate(),last={},sold={};
 S.sales.forEach(s=>{sold[s.k]=(sold[s.k]||0)+s.qty;if(!last[s.k]||s.date>last[s.k])last[s.k]=s.date});
 S.prods.forEach(p=>{
  if(p.stock<0){}
  else if(p.stock===0&&sold[p.k])a.push({t:"a",m:`${nm(p)}: AGOTADO.`});
  else if(p.stock>0&&p.stock<=p.min)a.push({t:"a",m:`${nm(p)}: quedan ${p.stock} (mínimo ${p.min}). Conviene producir.`});
  else if(p.stock>=5&&S.sales.length&&(!last[p.k]||dd(last[p.k],ref)>90))a.push({t:"m",m:`${nm(p)}: ${p.stock} en bodega y sin ventas hace ${last[p.k]?dd(last[p.k],ref)+" días":"mucho tiempo"}.`});});
 S.sup.forEach(s=>{if(s.stock<=s.min)a.push({t:"a",m:`Insumo ${s.n}${s.sz?" "+s.sz:""}: quedan ${s.stock} (mínimo ${s.min}). Comprar.`})});
 return a.sort((x,y)=>x.t<y.t?-1:1)}
function render(){if(ed&&ed[0]!==({prods:"p",ven:"s",pro:"g",sup:"u"})[tab])ed=null;$("#nav").innerHTML=TABS.map(([k,n])=>`<button class="${k===tab?"on":""}" onclick="tab='${k}';render()">${n}${k==="rev"&&nIss()?" ("+nIss()+")":""}</button>`).join("");
 $("#v").innerHTML=({panel,gra,rev,prods,ven,pro,sup,imp,con})[tab]();sv0()}
const cost=s=>{const p=P(s.k);return p?p.cost*s.qty:0};
function welcome(){return `<div class="c"><h2>👋 Bienvenida</h2><div class="mu">El sistema está vacío y listo para usar. Tus datos se guardan en este equipo.</div>
 <div class="r" style="margin-top:10px"><b>1.</b> Si ya tienes tu Excel: <button class="p" onclick="tab='imp';render()">Importar mi Excel</button></div>
 <div class="r"><b>2.</b> Si empiezas de cero: <button onclick="tab='prods';render()">Agregar mis productos</button></div>
 <div class="r"><b>3.</b> Luego registra <button onclick="tab='pro';render()">Producción</button> y <button onclick="tab='ven';render()">Ventas</button>: el inventario se actualiza solo.</div>
 <div class="r"><b>4.</b> Al terminar el día pulsa <b>«Guardar todo en Excel»</b>, arriba.</div></div>`}
function panel(){if(!S.prods.length&&!S.sales.length)return welcome();
 const al=alerts(),M={},C={},T={};let tot=0,ut=0;
 S.sales.forEach(s=>{const m=s.date.slice(0,7);M[m]=(M[m]||0)+s.total;C[s.ch]=(C[s.ch]||0)+s.total;T[s.k]=(T[s.k]||0)+s.qty;tot+=s.total;ut+=s.total-cost(s)});
 const ms=Object.keys(M).sort().slice(-12),mx=Math.max(1,...ms.map(m=>M[m]));
 const top=Object.entries(T).sort((a,b)=>b[1]-a[1]).slice(0,6),tm=top[0]?top[0][1]:1;
 const chs=Object.entries(C).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const inv=S.prods.reduce((a,p)=>a+Math.max(0,p.stock)*p.price,0);
 return `<div class="k"><div><b>${S.prods.length}</b><span>Productos</span></div><div><b>${money(inv)}</b><span>Inventario a precio de venta</span></div>
 <div><b>${money(tot)}</b><span>Ventas registradas</span></div><div><b>${money(ut)}</b><span>Utilidad estimada</span></div><div><b>${al.length}</b><span>Alertas</span></div></div>
 ${nIss()?`<div class="al"><b>${nIss()}</b> puntos por revisar en tus datos. <button onclick="tab='rev';render()">Ver revisión</button></div>`:""}${infos().length?`<div class="al i"><b>${infos().length}</b> productos se vendieron más de lo que hay anotado como producido. No es un error: falta anotar producción. <button onclick="tab='rev';render()">Ver</button></div>`:""}${planCard()}${autoCard()}<div class="c"><h2>Alertas</h2>${al.length?al.slice(0,40).map(x=>`<div class="al ${x.t}">${esc(x.m)}</div>`).join("")+(al.length>40?`<div class="mu">y ${al.length-40} más…</div>`:""):'<span class="mu">Sin alertas. Importa tu Excel para empezar.</span>'}</div>
 <div class="c"><h2>Ventas por mes</h2>${ms.map(m=>`<div class="r"><span style="width:70px">${m}</span><div style="flex:1;min-width:80px"><div class="bar" style="width:${M[m]/mx*100}%"></div></div><b>${money(M[m])}</b></div>`).join("")||'<span class="mu">Sin ventas.</span>'}</div>
 <div class="c"><h2>Productos más vendidos (unidades)</h2>${top.map(([k,v])=>`<div class="r"><span style="width:230px;overflow:hidden">${esc(P(k)?nm(P(k)):k)}</span><div style="flex:1;min-width:60px"><div class="bar" style="width:${v/tm*100}%"></div></div><b>${v}</b></div>`).join("")||'<span class="mu">Sin datos.</span>'}</div>
 <div class="c"><h2>Ventas por canal / punto de venta</h2>${chs.map(([c,v])=>`<div class="r"><span style="flex:1">${esc(c)}</span><b>${money(v)}</b></div>`).join("")||'<span class="mu">Sin datos.</span>'}</div>`}
function prods(){const ei=ed&&ed[0]==="p"?+ed.slice(2):-1,e=ei>=0?S.prods[ei]:null,L=S.prods.map((p,i)=>({p,i})).filter(x=>norm(nm(x.p)).includes(norm(q)));
 return `<div class="c"><h2>${e?"Editar producto":"Nuevo producto"}</h2><div class="r"><input id="n1" placeholder="Producto" value="${esc(e?e.n:"")}"><input id="n2" placeholder="Tamaño (130 ML)" style="width:120px" value="${esc(e?e.sz:"")}">
 <input id="n3" type="number" placeholder="Precio" style="width:90px" value="${e?e.price:""}"><input id="n4" type="number" placeholder="Costo" style="width:90px" value="${e?e.cost:""}"><input id="n5" type="number" placeholder="Stock" style="width:80px" value="${e?e.stock:""}"><input id="n6" type="number" placeholder="Mínimo" style="width:80px" value="${e?e.min:""}">
 <button class="p" onclick="newP()">${e?"Guardar cambios":"Guardar producto"}</button>${e?'<button onclick="ed=null;render()">Cancelar</button>':""}</div></div>
 <div class="c"><div class="r"><h2 style="margin:0;flex:1">Inventario de productos</h2><input id="qs" placeholder="Buscar…" value="${esc(q)}" oninput="q=this.value;render();const x=$('#qs');x.focus();x.setSelectionRange(q.length,q.length)" style="width:160px"></div>
 <div class="t"><table><tr><th>Producto</th><th>Precio</th><th>Costo</th><th>Margen</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th></th></tr>
 ${L.slice(0,200).map(({p,i})=>`<tr><td>${esc(nm(p))}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td>${p.price?Math.round((p.price-p.cost)/p.price*100):0}%</td>
 <td><input type="number" value="${p.stock}" onchange="setP(${i},'stock',this.value)"></td><td><input type="number" value="${p.min}" onchange="setP(${i},'min',this.value)"></td>
 <td>${p.stock<0?'<span class="tag">Falta anotar producción</span>':p.stock<=p.min?'<span class="tag m">Bajo</span>':'<span class="tag">OK</span>'}</td>
 <td><button onclick="ed='p:${i}';render();scrollTo(0,0)">Editar</button> <button onclick="delP(${i})">Eliminar</button></td></tr>`).join("")||'<tr><td colspan=8 class="mu">Sin productos</td></tr>'}</table></div>
 <div class="mu">Cambiar el stock en la tabla equivale a un conteo físico. Se guarda automáticamente.</div></div>`}
function newP(){const n=$("#n1").value.trim();if(!n){toast("Escribe el nombre del producto");return}
 const sz=$("#n2").value.trim(),k=key(n,sz),d={k,n,sz,price:+$("#n3").value||0,cost:+$("#n4").value||0,stock:+$("#n5").value||0,min:$("#n6").value===""?3:+$("#n6").value},i=ed&&ed[0]==="p"?+ed.slice(2):-1;
 if(S.prods.some((p,j)=>p.k===k&&j!==i)){toast("Ya existe un producto con ese nombre y tamaño. Edítalo en la lista.");return}
 let ren=false,oldK="";if(i>=0){const old=S.prods[i].k;oldK=old;if(old!==k){ren=true;S.sales.forEach(s=>{if(s.k===old)s.k=k});S.prod.forEach(s=>{if(s.k===old)s.k=k});cart.forEach(l=>{if(l.k===old)l.k=k})}S.prods[i]=d}else S.prods.push(d);
 fixed(k);if(oldK)fixed(oldK);ed=null;save();ren?syncAll():syncInv();toast("✓ Guardado");render()}
function setP(i,f,v){S.prods[i][f]=+v||0;if(f==="stock")fixed(S.prods[i].k);save();syncInv();render()}
function askC(msg,yes,label){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px";
 d.innerHTML=`<div class="c" style="max-width:440px;margin:0"><div style="margin-bottom:14px">${esc(msg)}</div><div class="r" style="justify-content:flex-end;margin:0"><button id="dn">Cancelar</button><button class="p" id="dy">${esc(label||"Aceptar")}</button></div></div>`;
 document.body.appendChild(d);d.querySelector("#dn").onclick=()=>d.remove();d.querySelector("#dy").onclick=()=>{d.remove();yes()}}
function delP(i){const p=S.prods[i];askC(`¿Eliminar "${nm(p)}"? Sus ventas y producción anteriores se conservan en el historial.`,()=>{S.prods.splice(i,1);fixed(p.k);cart=cart.filter(l=>P(l.k));ed=null;save();syncInv();toast("✓ Eliminado");render()},"Eliminar")}
function borrarTodo(){askC("Se borrarán todos los productos, ventas, producción e insumos de este equipo y la página quedará vacía y limpia. Las conexiones (WhatsApp y Make) se conservan. Si no guardaste un Excel, estos datos se pierden. ¿Borrar todo?",()=>{
 S={prods:[],prod:[],sales:[],sup:[],issues:[],cfg:{phone:S.cfg.phone||"",hook:S.cfg.hook||"",gs:S.cfg.gs||""}};cart=[];ed=null;q="";tab="panel";noDirty=true;save();noDirty=false;render();toast("✓ Página limpia")},"Sí, borrar todo")}
const toast=t=>{const e=$("#sv");if(e){e.textContent=t;setTimeout(sv0,2500)}};
const syncAll=()=>hook("todo",tables());
const pl=k=>P(k)?nm(P(k)):k,hist=s=>String(s.ch||"").startsWith("Histórico");
function saveS(i){const s=S.sales[i],p=P(s.k),q=+$("#e3").value;if(!(q>0)){toast("Cantidad inválida");return}
 let t=+$("#e4").value||0;if(t===Math.round(s.total)&&q!==s.qty)t=s.total/s.qty*q;
 if(p&&!hist(s))p.stock+=s.qty-q;s.date=$("#e1").value||s.date;s.ch=$("#e2").value.trim()||s.ch;s.qty=q;s.total=t;ed=null;save();syncAll();toast("✓ Guardado");render()}
function delS(i){const s=S.sales[i],p=P(s.k),adj=p&&!hist(s);askC("¿Eliminar esta venta?"+(adj?" Las unidades vuelven al inventario.":""),()=>{if(adj)p.stock+=s.qty;S.sales.splice(i,1);ed=null;save();syncAll();toast("✓ Eliminado");render()},"Eliminar")}
function saveG(i){const s=S.prod[i],p=P(s.k),q=+$("#e3").value;if(!(q>0)){toast("Cantidad inválida");return}
 if(p&&!s.h)p.stock+=q-s.qty;s.date=$("#e1").value||s.date;s.qty=q;ed=null;save();syncAll();toast("✓ Guardado");render()}
function delG(i){const s=S.prod[i],p=P(s.k),adj=p&&!s.h;askC("¿Eliminar este registro de producción?"+(adj?" Se descuenta del inventario.":""),()=>{if(adj)p.stock-=s.qty;S.prod.splice(i,1);ed=null;save();syncAll();toast("✓ Eliminado");render()},"Eliminar")}
function saveU(){const n=$("#u1").value.trim();if(!n){toast("Escribe el nombre");return}const ty=$("#u3").value,
 d={n,sz:$("#u2").value.trim(),type:ty,stock:+$("#u4").value||0,cost:+$("#u5").value||0,min:$("#u6").value===""?(ty==="Envase"?20:1):+$("#u6").value},i=ed&&ed[0]==="u"?+ed.slice(2):-1;
 if(i>=0)S.sup[i]=d;else S.sup.push(d);ed=null;save();syncInv();toast("✓ Guardado");render()}
function delU(i){askC(`¿Eliminar "${S.sup[i].n}"?`,()=>{S.sup.splice(i,1);ed=null;save();syncInv();toast("✓ Eliminado");render()},"Eliminar")}
const opts=()=>S.prods.map(p=>`<option value="${p.k}">${esc(nm(p))}</option>`).join("");
function ven(){const sub=cart.reduce((a,l)=>a+l.q*P(l.k).price,0),eI=ed&&ed[0]==="s"?+ed.slice(2):-1,
 R=S.sales.map((s,i)=>({s,i})).sort((a,b)=>b.s.date.localeCompare(a.s.date)||b.i-a.i).slice(0,60);
 return `<div class="c"><h2>Registrar venta</h2><div class="r"><select id="vp">${opts()}</select><input id="vq" type="number" min="1" value="1" style="width:80px"><button onclick="addL()">Agregar</button></div>
 ${cart.map((l,i)=>`<div class="r"><span style="flex:1">${esc(nm(P(l.k)))} × ${l.q}</span><b>${money(l.q*P(l.k).price)}</b><button onclick="cart.splice(${i},1);render()">Quitar</button></div>`).join("")}
 <div class="r"><input id="vd" type="date" value="${today()}"><input id="vc" list="chs" placeholder="Canal / punto (Domicilio, Park 33…)" style="width:240px">
 <datalist id="chs">${[...new Set(S.sales.map(s=>s.ch))].map(c=>`<option>${esc(c)}</option>`).join("")}</datalist>
 <input id="vx" type="number" placeholder="Descuento %" style="width:110px"><b>${money(sub)}</b><button class="p" onclick="regS()">Registrar venta</button></div>
 <div class="mu">Cada venta descuenta el stock y se guarda en Google Sheets si está conectado.</div></div>
 <div class="c"><h2>Últimas ventas</h2><div class="t"><table><tr><th>Fecha</th><th>Canal</th><th>Producto</th><th>Cant.</th><th>Total</th><th></th></tr>
 ${R.map(({s,i})=>i===eI?`<tr><td><input id="e1" type="date" value="${s.date}" style="width:140px"></td><td><input id="e2" value="${esc(s.ch)}" style="width:130px"></td><td>${esc(pl(s.k))}</td><td><input id="e3" type="number" value="${s.qty}"></td><td><input id="e4" type="number" value="${Math.round(s.total)}" style="width:90px"></td><td><button class="p" onclick="saveS(${i})">Guardar</button> <button onclick="ed=null;render()">Cancelar</button></td></tr>`
 :`<tr><td>${s.date}</td><td>${esc(s.ch)}</td><td>${esc(pl(s.k))}</td><td>${s.qty}</td><td>${money(s.total)}</td><td><button onclick="ed='s:${i}';render()">Editar</button> <button onclick="delS(${i})">Eliminar</button></td></tr>`).join("")||'<tr><td colspan=6 class="mu">Sin ventas</td></tr>'}</table></div></div>`}
function addL(){const k=$("#vp").value,n=+$("#vq").value;if(!k||n<=0)return;const l=cart.find(x=>x.k===k);l?l.q+=n:cart.push({k,q:n});render()}
function regS(){if(!cart.length)return;const d=$("#vd").value||today(),ch=$("#vc").value.trim()||"Sin canal",x=+$("#vx").value||0,out=[];
 cart.forEach(l=>{const p=P(l.k);p.stock-=l.q;const s={date:d,ch,k:l.k,qty:l.q,total:l.q*p.price*(1-x/100)};S.sales.push(s);out.push({producto:p.n,tamano:p.sz,cantidad:l.q,total:s.total,stock_restante:p.stock})});
 cart=[];save();hook("venta",{fecha:d,canal:ch,items:out});render();if(out.some(o=>o.stock_restante<0))toast("Venta anotada. Se vendió más de lo producido: falta anotar producción.")}
function pro(){const eI=ed&&ed[0]==="g"?+ed.slice(2):-1,R=S.prod.map((s,i)=>({s,i})).sort((a,b)=>b.s.date.localeCompare(a.s.date)||b.i-a.i).slice(0,60);
 return `<div class="c"><h2>Registrar producción</h2><div class="r"><select id="gp">${opts()}</select><input id="gq" type="number" placeholder="Unidades" style="width:100px"><input id="gd" type="date" value="${today()}"><button class="p" onclick="regP()">Sumar al inventario</button></div></div>
 <div class="c"><h2>Producción reciente</h2><div class="t"><table><tr><th>Fecha</th><th>Producto</th><th>Unidades</th><th></th></tr>

function svgPie(it){const tot=it.reduce((a,x)=>a+x.v,0);if(!tot)return nod();let a0=-Math.PI/2,s=`<svg viewBox="0 0 560 220" width="100%"><g transform="translate(110,110)">`;
 it.forEach((x,i)=>{const a1=a0+x.v/tot*2*Math.PI,c=COL[i%COL.length];
  if(it.length===1)s+=`<circle r="100" fill="${c}"/>`;
  else s+=`<path d="M0 0L${100*Math.cos(a0)} ${100*Math.sin(a0)}A100 100 0 ${a1-a0>Math.PI?1:0} 1 ${100*Math.cos(a1)} ${100*Math.sin(a1)}Z" fill="${c}" stroke="var(--card)" stroke-width="2"><title>${esc(x.n)}: ${money(x.v)}</title></path>`;a0=a1});
 s+="</g>";it.forEach((x,i)=>{s+=`<rect x="240" y="${14+i*24}" width="12" height="12" rx="2" fill="${COL[i%COL.length]}"/><text x="260" y="${24+i*24}" font-size="12" fill="var(--tx)">${esc(x.n.slice(0,28))} · ${Math.round(x.v/tot*100)}%</text>`});return s+"</svg>"}
function svgScatter(pt){if(!pt.length)return nod();const mxx=Math.max(1,...pt.map(p=>p.x)),mnx=Math.min(0,...pt.map(p=>p.x)),my=Math.max(1,...pt.map(p=>p.y)),X=v=>CL+(CW-CL-14)*(v-mnx)/((mxx-mnx)||1),Y=v=>CT+(CH-CT-CB)*(1-v/my);
 let s=`<svg viewBox="0 0 ${CW} ${CH+14}" width="100%">`+grid(my);
 for(let i=0;i<=4;i++){const v=mnx+(mxx-mnx)*i/4;s+=`<text x="${X(v)}" y="${CH-CB+14}" text-anchor="middle" font-size="10" fill="var(--mu)">${Math.round(v)}%</text>`}
 pt.forEach(p=>{s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="var(--ac)" fill-opacity=".65" stroke="var(--ac)"><title>${esc(p.n)}: margen ${Math.round(p.x)}%, ${p.y} unidades</title></circle>`});
 return s+`<text x="${CW/2}" y="${CH+10}" text-anchor="middle" font-size="11" fill="var(--mu)">Margen % (eje vertical: unidades vendidas)</text></svg>`}
function gra(){const ref=refDate(),per=gper,sum=(L,f,v)=>L.filter(f).reduce((a,s)=>a+s[v],0);let lab,sv,su,pu;
 if(per==="m"){const ks=[...new Set([...S.sales.map(s=>s.date.slice(0,7)),...S.prod.map(s=>s.date.slice(0,7))])].sort().slice(-12);
  lab=ks.map(k=>k.slice(5)+"/"+k.slice(2,4));const m=k=>s=>s.date.slice(0,7)===k;
  sv=ks.map(k=>sum(S.sales,m(k),"total"));su=ks.map(k=>sum(S.sales,m(k),"qty"));pu=ks.map(k=>sum(S.prod,m(k),"qty"))}
 else{const ds=[...Array(30)].map((_,i)=>new Date(new Date(ref).getTime()-(29-i)*864e5).toISOString().slice(0,10));lab=ds.map(d=>d.slice(8));const m=d=>s=>s.date===d;
  sv=ds.map(d=>sum(S.sales,m(d),"total"));su=ds.map(d=>sum(S.sales,m(d),"qty"));pu=ds.map(d=>sum(S.prod,m(d),"qty"))}
 const R={},U={};S.sales.forEach(s=>{R[s.k]=(R[s.k]||0)+s.total;U[s.k]=(U[s.k]||0)+s.qty});
 const arr=Object.entries(R).sort((a,b)=>b[1]-a[1]),pie=arr.slice(0,7).map(([k,v])=>({n:pl(k),v})),rest=arr.slice(7).reduce((a,x)=>a+x[1],0);if(rest>0)pie.push({n:"Otros",v:rest});
 const pts=S.prods.filter(p=>p.price>0&&U[p.k]>0).map(p=>({x:(p.price-p.cost)/p.price*100,y:U[p.k],n:nm(p)}));
 return `<div class="r"><b>Periodo:</b><select onchange="gper=this.value;render()"><option value="m"${per==="m"?" selected":""}>Por mes</option><option value="d"${per==="d"?" selected":""}>Por día (últimos 30 días)</option></select></div>
 <div class="c"><h2>Ventas ($) · barras</h2>${svgBar(lab,sv,money)}</div>
 <div class="c"><h2>Unidades vendidas vs. producidas · líneas</h2>${svgLine(lab,[{n:"Vendidas",v:su,c:COL[1]},{n:"Producidas",v:pu,c:COL[0]}])}<div class="mu">Si las vendidas superan a las producidas varios periodos seguidos, el inventario se está agotando: toca producir.</div></div>
 <div class="c"><h2>Ventas por producto · circular</h2>${svgPie(pie)}</div>
 <div class="c"><h2>Margen vs. unidades vendidas · dispersión</h2>${svgScatter(pts)}<div class="mu">Cada punto es un producto. Arriba a la derecha: venden mucho y dejan buen margen.</div></div>`}
function liveChecks(){const o=[];S.prods.forEach(p=>{
 
 if(p.price<=0)o.push({t:"m",k:p.k,m:`${nm(p)}: no tiene precio de venta.`});
 else if(p.cost>p.price)o.push({t:"a",k:p.k,m:`${nm(p)}: el costo (${money(p.cost)}) es mayor que el precio (${money(p.price)}).`});
 else if(p.cost<=0)o.push({t:"m",k:p.k,m:`${nm(p)}: no tiene costo, la utilidad no es confiable.`})});
 S.sup.forEach(s=>{if(s.stock<0)o.push({t:"a",m:`Insumo ${s.n}: cantidad negativa.`})});return o}
const infos=()=>S.prods.filter(p=>p.stock<0).map(p=>({k:p.k,m:`${nm(p)}: se vendieron ${-p.stock} unidades más de las que hay anotadas como producidas.`})),fixed=k=>{S.issues=(S.issues||[]).filter(x=>x.k!==k)};
const allIssues=()=>[...(S.issues||[]),...liveChecks()],nIss=()=>(S.issues||[]).length+liveChecks().length;
function rev(){const all=[...(S.issues||[]).map((x,i)=>({...x,i,src:1})),...liveChecks()];RV=all;const A=all.filter(x=>x.t==="a"),M=all.filter(x=>x.t!=="a"),inf=infos(),D=all.filter(x=>x.diff);
 const row=x=>{const n=all.indexOf(x),pi=x.k?S.prods.findIndex(p=>p.k===x.k):-1,p=pi>=0?S.prods[pi]:null;
  return `<div class="al ${x.t==="a"?"":"m"}"><div>${esc(x.m)}</div>${p?`<div class="r" style="margin:6px 0 0"><span class="mu">Precio</span><input id="rp${n}" type="number" value="${p.price}" style="width:90px"><span class="mu">Costo</span><input id="rc${n}" type="number" value="${p.cost}" style="width:90px"><span class="mu">Stock real</span><input id="rs${n}" type="number" value="${p.stock}" style="width:80px"><button class="p" onclick="saveRV(${n})">Guardar y corregir</button></div>`:""}<div class="r" style="margin:6px 0 0">${p?`<button onclick="fixRV(${n})">Editar ficha completa</button>`:""}${x.src?`<button onclick="dismissRV(${n})">Ocultar</button>`:""}</div></div>`};
 return (all.length?`<div class="c"><h2>Revisión</h2><div class="mu">Hay <b>${A.length}</b> errores y <b>${M.length}</b> avisos. Escribe el número correcto en el mismo aviso y pulsa «Guardar y corregir»: el punto desaparece y el próximo Excel que guardes sale corregido.</div></div>`:`<div class="c"><h2>Revisión</h2><div class="mu">✓ Todo cuadra. No hay nada por corregir.</div></div>`)
 +(D.length?`<div class="c"><h2>¿Por qué sale diferencia si mi Excel está bien?</h2><div class="mu">Tus ventas y tu producción pueden estar bien anotadas. Lo que falla son las <b>fórmulas que unen las hojas</b>: sobre todo desde mayo, los productos de cada hoja de mes no están en la misma fila que en la hoja TOTAL, y Excel suma por fila, así que a veces suma ventas de productos distintos. El sistema suma por nombre del producto, por eso sus números pueden diferir. Lo más seguro es comparar con tu conteo físico.</div><div class="r" style="margin-top:8px"><button class="p" onclick="acceptDiff()">Usar los números del sistema en las ${D.length} diferencias</button></div></div>`:"")
 +(A.length?`<div class="c"><h2>Errores</h2>${A.slice(0,120).map(row).join("")}${A.length>120?`<div class="mu">y ${A.length-120} más…</div>`:""}</div>`:"")
 +(M.length?`<div class="c"><h2>Avisos</h2>${M.slice(0,120).map(row).join("")}${M.length>120?`<div class="mu">y ${M.length-120} más…</div>`:""}</div>`:"")
 +(inf.length?`<div class="c"><h2>Para tu información</h2><div class="mu">Estos productos se vendieron más de lo que hay anotado como producido. No es un error: normalmente falta anotar producción. Al registrarla desaparece de aquí.</div>${inf.slice(0,60).map(x=>`<div class="al i">${esc(x.m)}</div>`).join("")}${inf.length>60?`<div class="mu">y ${inf.length-60} más…</div>`:""}<div class="r" style="margin-top:8px"><button onclick="tab='pro';render()">Registrar producción</button></div></div>`:"")}
function saveRV(n){const x=RV[n],p=P(x.k);if(!p)return;p.price=+$("#rp"+n).value||0;p.cost=+$("#rc"+n).value||0;p.stock=+$("#rs"+n).value||0;fixed(x.k);save();syncInv();toast("✓ Corregido");render()}

 +row(g,"Guardado en Google Sheets",g?"Cada registro se envía solo a tu hoja."+(S.cfg.sync?" Último envío: "+S.cfg.sync:""):"Falta pegar la URL en Conexiones.")
 +row(m,"Make / Airtable / Zapier",m?"Cada evento se envía al webhook.":"Opcional: pega el webhook en Conexiones.")+row(ph,"Alertas por WhatsApp",ph?"Mensaje listo para enviar desde Conexiones.":"Falta el número en Conexiones.")+`</div>`}
function tables(){const pn=k=>P(k)||{n:k,sz:""};return{Productos:S.prods.map(p=>({Producto:p.n,"Tamaño":p.sz,Precio:p.price,Costo:p.cost,Stock:p.stock,"Mínimo":p.min})),Ventas:S.sales.map(x=>({Fecha:x.date,Canal:x.ch,Producto:pn(x.k).n,"Tamaño":pn(x.k).sz,Cantidad:x.qty,Total:x.total})),"Producción":S.prod.map(x=>({Fecha:x.date,Producto:pn(x.k).n,"Tamaño":pn(x.k).sz,Unidades:x.qty})),Insumos:S.sup.map(x=>({"Ítem":x.n,Detalle:x.sz,Tipo:x.type,Cantidad:x.stock,Costo:x.cost,"Mínimo":x.min}))}}

 const L=S.prods.filter(p=>p.stock<=p.min&&s90[p.k]>0).map(p=>{const m=Math.ceil(s90[p.k]/3);return{p,m,u:Math.max(m-p.stock,p.min+1-p.stock)}}).sort((a,b)=>b.u-a.u).slice(0,12);
